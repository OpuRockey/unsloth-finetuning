[project]
name = "unsloth-finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Rockeybul Alam", email = "opu.rockey@gmail.com" }
]
requires-python = ">=3.13.14"
dependencies = []

[project.scripts]
unsloth-finetuning = "unsloth_finetuning:main"

[build-system]
